#turntable.ini
# Written by hand for non-standard hardware configuration

[EMC]
MACHINE = CNC Turntable
DEBUG = 0
VERSION = 1.1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[MOTMOD]
# Defines the threads:
# base-thread (fast, every 50,000 ns)
# servo-thread (slower, every 1,000,000 ns)
BASE_PERIOD_NSEC = 50000
SERVO_PERIOD_NSEC = 1000000

[DISPLAY]
# Headless unit, no display needed.
DISPLAY = linuxcncrsh
EDITOR = gedit
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
CYCLE_TIME = 0.100
PROGRAM_PREFIX = /home/turntable/linuxcnc/nc_files

[KINS]
JOINTS = 1
NUM_JOINTS = 1
# Defines a single angular joint. This possibility was not documented on linuxcnc.org
KINEMATICS = trivkins coordinates=A

[TRAJ]
COORDINATES = A
ANGULAR_UNITS = degree
LINEAR_UNITS = inch
DEFAULT_ANGULAR_VELOCITY = 10.00
MAX_ANGULAR_VELOCITY = 50.00

[HAL]
HALFILE = turntable.hal

[GPIO]
# Input pins: 24 for estop
INPUTS = GPIO24
# Output pins: 22 for direction, 27 for step pulses
OUTPUTS = GPIO17,GPIO22,GPIO27
# Pins that need pull-up resistors
# PULLUPS = 
# Pins that need inverted logic levels
INVERT = GPIO17

#*** AXIS_A *******************************
[AXIS_A]
TYPE = ANGULAR
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 50.0
WRAPPED_ROTARY = 1

[JOINT_0]
TYPE = ANGULAR
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 50.0
STEPGEN_MAXACCEL = 75.0
# Amount of pulses per machine unit (degrees). Determined by math below
# 1 step			360 step deg	40 step rev			1 scale rev			14400 step	22.22 step
# ------------	*	------------	*	-----------	*	-------------	= 	-------------	=	-----------
# 1.8 step deg		1 step rev		1 scale rev			360 scale deg		648 scale deg		1 scale deg
SCALE = 22.2222
FERROR = 50.0
MIN_FERROR = 25
HOME_OFFSET = 0.0
# Tells LinuxCNC that the joint doesn't need homing
HOME_SEQUENCE = -1

[STEPGEN_0]
# Minimum length of step pulses
STEP_LEN = 1500
# Minimum length between step pulses
STEP_SPACE = 1500
# Minimum time between rising edge of direction signal and rising edge of step pulse
DIR_SETUP = 5000
# Minimum time to hold direction signal after last step pulse
DIR_HOLD = 5000

